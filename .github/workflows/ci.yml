name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Syntax check
        run: for f in $(git ls-files 'lib/*.rb' 'test/*.rb'); do ruby -c "$f"; done
      - name: Tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build arara.gemspec
