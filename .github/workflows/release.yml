name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Syntax check
        run: for f in $(git ls-files 'lib/*.rb' 'test/*.rb'); do ruby -c "$f"; done
      - name: Tests
        run: bundle exec rake test
      - name: Check if version is published
        id: version
        run: |
          version=$(ruby -Ilib -e 'require "arara/version"; print Arara::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/ararahq/versions/$version.json")
          if [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ararahq $version already on rubygems.org, skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to RubyGems (Trusted Publishing)
        if: steps.version.outputs.publish == 'true'
        uses: rubygems/release-gem@v1
        with:
          await-release: true
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
